[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vbuild"
version = "0.3.26"
description = "A small VASP structure editor"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.0,<3", "ase>=3.26,<4", "scipy>=1.13,<2"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7", "pyvista>=0.46,<1", "pyvistaqt>=0.11,<1", "vtk>=9.4,<10", "spglib>=2.6,<3", "matplotlib>=3.9,<4"]
relax = ["mace-torch>=0.3.14,<0.4", "torch>=2.9,<3"]
nep = ["nep-adapters[ase]>=1.0.3,<2"]
molecules = ["rdkit>=2025.9"]

[project.scripts]
vbuild = "vbuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vbuild = ["keys.json", "settings.json", "runtime.json", "icons/*.svg", "icons/*.ico", "icons/*.png"]
